kind = "web"
previewPath = "/"
title = "VARUNA Security Console"
description = "A production-grade cybersecurity analysis workspace for graph-guided code reasoning, timing and protocol testing, evidence-backed findings, patch review, and security re-verification."
version = "1.0.0"
id = "artifacts/varuna-console"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26021

[services.development]
run = "pnpm --filter @workspace/varuna-console run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/varuna-console", "run", "build" ]
serve = "static"
publicDir = "artifacts/varuna-console/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26021"
BASE_PATH = "/"
